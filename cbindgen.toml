language = "C"
include_guard = "SAFETENSORS_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify manually. */"
include_version = true
cpp_compat = true
tab_width = 4
style = "both"

[export]
include = [
    "SafetensorsStatus",
    "SafetensorsDtype",
    "SafetensorsHandle",
    "SafetensorsSerializer",
    "SafetensorsTensorView",
    "SafetensorsTensorInput",
    "SafetensorsMetadataEntry",
]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = false

[parse]
parse_deps = false
