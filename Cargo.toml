[package]
name = "safetensors-c"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "Embeddable C FFI wrapper library around the Hugging Face safetensors Rust crate"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ThirdLetterC/safetensors-c"
keywords = ["safetensors", "ffi", "c", "tensors", "machine-learning"]
categories = ["api-bindings", "science"]

[lib]
name = "safetensors_c"
crate-type = ["staticlib", "cdylib"]

[features]
default = ["regen-header"]
# When enabled, build.rs invokes cbindgen to refresh target/include/safetensors_cbindgen.h
regen-header = ["dep:cbindgen"]

[dependencies]
safetensors = "0.8"
memmap2 = "0.9"
libc = "0.2"

[build-dependencies]
cbindgen = { version = "0.29", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
